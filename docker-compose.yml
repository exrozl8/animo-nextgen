services:
  animo:
    build: .
    container_name: animo-app
    restart: always
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./hls:/app/hls
      - ./cdn:/app/cdn
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/home"]
      interval: 30s
      timeout: 10s
      retries: 3
